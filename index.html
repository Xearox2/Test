<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mBank Quantum 2026 - Pełny System</title>
    <style>
        :root {
            --bg-main: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --card-inner: rgba(31, 41, 55, 0.5);
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
            --accent-red: #ff0055;
            --accent-blue: #00f0ff;
            --accent-purple: #9d00ff;
            --border-color: rgba(0, 240, 255, 0.15);
            --pointer-x: 50%;
            --pointer-y: 50%;
            --card-rotate-x: 0deg;
            --card-rotate-y: 0deg;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
        }

        /* Tło */
        body::before {
            content: ''; position: absolute; width: 200vw; height: 200vh;
            background-image: linear-gradient(var(--border-color) 1px, transparent 1px), linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
            background-size: 40px 40px; opacity: 0.15; z-index: -1;
            transform: perspective(500px) rotateX(60deg); animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove { 0% { transform: perspective(500px) rotateX(60deg) translateY(0); } 100% { transform: perspective(500px) rotateX(60deg) translateY(40px); } }

        .app-viewport {
            width: 100%; max-width: 414px; height: 100vh; max-height: 850px;
            background-color: var(--bg-main); position: relative; display: flex; flex-direction: column;
            overflow: hidden; box-shadow: 0 0 50px rgba(0, 240, 255, 0.15); border: 1px solid var(--border-color);
        }
        @media (min-width: 420px) { .app-viewport { border-radius: 44px; } }

        /* EKRAN LOGOWANIA */
        #login-screen {
            flex: 1; display: flex; flex-direction: column; justify-content: center;
            align-items: center; padding: 35px; text-align: center; z-index: 10;
        }
        .m-logo {
            font-size: 32px; font-weight: 900; letter-spacing: -1px;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 30px;
        }
        .face-id-box {
            width: 96px; height: 96px; border-radius: 32px; background: var(--card-bg);
            border: 1px solid var(--accent-blue); display: flex; align-items: center;
            justify-content: center; font-size: 38px; margin-bottom: 25px;
            cursor: pointer; position: relative; overflow: hidden;
            transition: transform 0.2s, border-color 0.3s, box-shadow 0.3s;
        }
        .face-id-box:hover { transform: scale(1.05); border-color: var(--accent-purple); }
        .face-laser {
            position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: var(--accent-blue); opacity: 0;
        }
        .face-id-box.scanning .face-laser { opacity: 1; animation: scanLaser 1.5s ease-in-out infinite alternate; }
        @keyframes scanLaser { 0% { transform: translateY(0); } 100% { transform: translateY(93px); } }

        .input-group { width: 100%; margin-bottom: 20px; text-align: left; }
        .input-group label { font-size: 10px; color: var(--accent-blue); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; display: block; margin-bottom: 8px; }
        .input-group input {
            width: 100%; padding: 16px; border-radius: 16px; border: 1px solid var(--border-color);
            background: var(--card-inner); color: var(--text-main); font-size: 16px; outline: none;
        }
        .btn-primary {
            width: 100%; padding: 16px; border-radius: 16px; border: none;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-purple));
            color: white; font-size: 15px; font-weight: 700; cursor: pointer;
        }

        /* EKRAN APLIKACJI GŁÓWNY */
        #app-screen { flex: 1; display: none; flex-direction: column; height: 100%; z-index: 10; }
        .app-header { padding: 20px 24px 10px; display: flex; justify-content: space-between; align-items: center; }
        .user-profile { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .avatar {
            width: 44px; height: 44px; border-radius: 14px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            display: flex; align-items: center; justify-content: center; font-weight: 900;
            color: white; font-size: 15px; overflow: hidden; background-size: cover; background-position: center;
        }
        .user-info h4 { margin: 0; font-size: 15px; font-weight: 700; }
        .user-info p { margin: 2px 0 0; font-size: 10px; color: var(--accent-blue); text-transform: uppercase; letter-spacing: 0.8px; }

        .content-area { flex: 1; overflow-y: auto; padding: 10px 20px 20px; scrollbar-width: none; }
        .content-area::-webkit-scrollbar { display: none; }
        .view-section { display: none; animation: fadeIn 0.3s ease; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* Moduł Pulpitu */
        .balance-card {
            background: linear-gradient(135deg, rgba(17, 24, 39, 0.9), rgba(11, 15, 25, 0.95));
            border: 1px solid var(--accent-blue); border-radius: 28px; padding: 26px; margin-bottom: 20px;
        }
        .balance-label { font-size: 11px; color: var(--text-sub); margin: 0; text-transform: uppercase; letter-spacing: 1px; }
        .balance-val { font-size: 34px; font-weight: 900; margin: 8px 0 18px; color: #fff; }
        .quick-actions { display: flex; gap: 10px; }
        .action-chip {
            flex: 1; background: var(--card-inner); border: 1px solid var(--border-color);
            padding: 12px; border-radius: 14px; text-align: center; font-size: 11px;
            font-weight: 700; color: var(--text-main); cursor: pointer; text-transform: uppercase;
        }
        .tx-list { background: var(--card-bg); border-radius: 24px; border: 1px solid var(--border-color); padding: 8px 18px; }
        .tx-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border-color); }
        .tx-item:last-child { border-bottom: none; }
        .tx-title { font-size: 13px; font-weight: 700; margin: 0; }
        .tx-date { font-size: 10px; color: var(--text-sub); margin-top: 3px; }
        .tx-amount { font-size: 13px; font-weight: 800; }
        .tx-amount.neg { color: var(--accent-red); }
        .tx-amount.pos { color: #00ff88; }

        /* Moduł Kart */
        .add-card-btn {
            background: var(--card-bg); border: 2px dashed var(--accent-blue); border-radius: 22px;
            padding: 16px; display: flex; align-items: center; justify-content: center;
            gap: 12px; cursor: pointer; margin-bottom: 18px;
        }
        .add-icon {
            width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            display: flex; align-items: center; justify-content: center; font-size: 20px; color: white;
        }
        .card-container { margin-bottom: 16px; perspective: 1000px; }
        .bank-card {
            height: 210px; border-radius: 24px; padding: 24px; color: white; position: relative;
            cursor: pointer; box-shadow: 0 20px 40px rgba(0,0,0,0.6); border: 1px solid var(--accent-blue);
            display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
            background: radial-gradient(circle at 80% 20%, rgba(34, 43, 69, 0.9) 0%, rgba(16, 22, 36, 0.95) 65%, rgba(11, 15, 25, 1) 100%);
            transition: transform 0.1s ease-out; transform-style: preserve-3d;
        }
        .card-chip { width: 44px; height: 34px; background: linear-gradient(135deg, #fce07c 0%, #d4af37 100%); border-radius: 6px; }
        .card-number { font-family: monospace; font-size: 19px; letter-spacing: 4px; z-index: 2; }
        .hologram-moby {
            position: absolute; right: 20px; bottom: 20px; width: 56px; height: 38px;
            border-radius: 8px; background: #090d16; overflow: hidden;
            transform: perspective(400px) rotateX(var(--card-rotate-x)) rotateY(var(--card-rotate-y));
        }
        .holo-shine {
            position: absolute; inset: -150%; background: conic-gradient(from 0deg at 50% 50%, rgba(0, 240, 255, 0.6), rgba(157, 0, 255, 0.6), rgba(255, 0, 85, 0.6), rgba(0, 240, 255, 0.6));
            mix-blend-mode: screen; opacity: 0.85; transform: translate(calc((var(--pointer-x) - 50%) * 0.3%), calc((var(--pointer-y) - 50%) * 0.3%));
        }

        /* Moduł BLIK */
        .blik-card { background: var(--card-bg); border-radius: 28px; border: 1px solid var(--accent-blue); padding: 30px 20px; text-align: center; }
        .blik-code {
            font-size: 42px; font-weight: 900; letter-spacing: 10px;
            background: linear-gradient(90deg, var(--accent-red), var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-family: monospace; margin: 20px 0;
        }
        .timer-bar { height: 6px; background: var(--card-inner); border-radius: 3px; overflow: hidden; margin-top: 15px; }
        .timer-fill { height: 100%; background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple)); width: 100%; transition: width 1s linear; }

        /* Moduł Ustawień / Profilu */
        .modal-overlay {
            display: none; position: absolute; inset: 0; background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(20px); z-index: 100; align-items: flex-end; justify-content: center;
        }
        .modal-content {
            background: linear-gradient(180deg, #111827 0%, #0b0f19 100%);
            border-radius: 32px 32px 0 0; border-top: 1px solid var(--accent-blue);
            padding: 25px; width: 100%; animation: slideUp 0.3s ease; max-height: 90vh; overflow-y: auto;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* Nawigacja */
        .bottom-nav {
            height: 75px; background: rgba(17, 24, 39, 0.9); border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; align-items: center
