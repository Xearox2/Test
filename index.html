<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikacja Bankowa Pro</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --primary: #2563eb;
            --accent: #38bdf8;
            --holo-x: 50%;
            --holo-y: 50%;
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --panel-bg: #ffffff;
            --text-color: #0f172a;
            --text-sub: #64748b;
            --border-color: #cbd5e1;
            --primary: #2563eb;
            --accent: #0284c7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        /* LOGOWANIE */
        #login-screen {
            background: var(--panel-bg);
            padding: 30px 20px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .face-id-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
            outline: none;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            transition: opacity 0.2s;
        }

        button.secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-sub);
        }

        button.danger {
            background: #ef4444;
            color: white;
            padding: 6px 12px;
            width: auto;
            font-size: 12px;
        }

        /* EKRAN GŁÓWNY & NAWIGACJA */
        #app-screen { display: none; }

        .nav-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            background: var(--panel-bg);
            padding: 5px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 10px 5px;
            font-size: 11px;
            background: transparent;
            color: var(--text-sub);
            border: none;
            border-radius: 10px;
            margin: 0;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #fff;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .panel {
            background: var(--panel-bg);
            padding: 18px;
            border-radius: 18px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        /* KARTY BANKOWE */
        .card-wrapper {
            margin-bottom: 15px;
        }

        .bank-card {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border-radius: 16px;
            padding: 18px;
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            cursor: pointer;
            position: relative;
        }

        .card-top { display: flex; justify-content: space-between; align-items: center; }
        .card-type { font-weight: bold; font-size: 12px; color: var(--accent); text-transform: uppercase; }
        .card-num { font-family: monospace; font-size: 16px; letter-spacing: 2px; margin: 15px 0; }

        /* PROSTOKĄTNY HOLOGRAM Z UNIKALNYM ZNACZKIEM */
        .card-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease;
            opacity: 0;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            padding: 0 12px;
        }

        .card-details.active {
            max-height: 250px;
            opacity: 1;
            padding: 12px;
            margin-top: 10px;
            border: 1px dashed var(--border-color);
        }

        .holo-rect {
            width: 80px;
            height: 45px;
            border-radius: 6px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at var(--holo-x) var(--holo-y), 
                        rgba(255,255,255,0.95) 0%, 
                        rgba(255, 0, 128, 0.6) 30%, 
                        rgba(0, 212, 255, 0.6) 60%, 
                        rgba(255, 230, 0, 0.6) 90%);
            box-shadow: inset 0 0 4px rgba(255,255,255,0.8), 0 2px 5px rgba(0,0,0,0.4);
            position: relative;
        }

        .holo-symbol {
            width: 24px;
            height: 24px;
            fill: #ffd700;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6));
        }

        /* BLIK */
        .blik-box {
            text-align: center;
            padding: 20px;
        }

        .blik-code {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 6px;
            color: var(--accent);
            font-family: monospace;
            margin: 15px 0;
        }

        .timer-bar {
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
        }

        .timer-progress {
            height: 100%;
            background: var(--accent);
            width: 100%;
            transition: width 1s linear;
        }

        /* HISTORIA TRANSAKCJI */
        .tx-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }

        .tx-item:last-child { border: none; }
        .tx-amount.neg { color: #ef4444; }
        .tx-amount.pos { color: #22c55e; }

        /* USTAWIENIA */
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. EKRAN LOGOWANIA (WebAuthn / Face ID) -->
    <div id="login-screen">
        <div class="face-id-icon">👤</div>
        <h3 style="margin:0 0 5px 0;">Aplikacja Bankowa</h3>
        <p id="login-sub" style="font-size:12px; color:var(--text-sub); margin-bottom:20px;">Wpisz hasło, aby powiązać je z Face ID</p>

        <div class="input-group" id="pwd-group">
            <label for="password">Hasło</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button id="primary-btn">Zaloguj i aktywuj Face ID</button>
        <button id="biometric-btn" class="secondary" style="display:none;">Zaloguj przez Face ID</button>
        <p id="status-msg" style="color:#ef4444; font-size:12px; margin-top:10px;"></p>
    </div>

    <!-- 2. EKRAN GŁÓWNY -->
    <div id="app-screen">
        
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('cards')">Karty</button>
            <button class="tab-btn" onclick="switchTab('blik')">BLIK</button>
            <button class="tab-btn" onclick="switchTab('history')">Historia</button>
            <button class="tab-btn" onclick="switchTab('settings')">Ustawienia</button>
        </div>

        <!-- ZAKŁADKA KARTY -->
        <div id="tab-cards" class="tab-content active">
            <div id="cards-container"></div>

            <div class="panel">
                <h4 style="margin:0 0 10px 0;">Dodaj nową kartę</h4>
                <div class="input-group">
                    <label for="newCardHolder">Właściciel</label>
                    <input type="text" id="newCardHolder" placeholder="JAN KOWALSKI">
                </div>
                <div class="input-group">
                    <label for="newCardType">Typ karty</label>
                    <select id="newCardType">
                        <option value="Debetowa">Debetowa</option>
                        <option value="Kredytowa">Kredytowa</option>
                    </select>
                </div>
                <button onclick="addCard()">Dodaj kartę</button>
            </div>
        </div>

        <!-- ZAKŁADKA BLIK -->
        <div id="tab-blik" class="tab-content">
            <div class="panel blik-box">
                <h3 style="margin:0;">Kod BLIK</h3>
                <div class="blik-code" id="blikCode">------</div>
                <div style="font-size:12px; color:var(--text-sub);" id="timerText">Ważny przez: 120s</div>
                <div class="timer-bar"><div class="timer-progress" id="timerProgress"></div></div>
                <button onclick="generateBLIK()" style="margin-top:20px;">Wygeneruj nowy kod</button>
            </div>
        </div>

        <!-- ZAKŁADKA HISTORIA -->
        <div id="tab-history" class="tab-content">
            <div class="panel">
                <h4 style="margin:0 0 10px 0;">Ostatnie transakcje</h4>
                <div id="history-list"></div>
            </div>
        </div>

        <!-- ZAKŁADKA USTAWIENIA -->
        <div id="tab-settings" class="tab-content">
            <div class="panel">
                <h4 style="margin:0 0 10px 0;">Ustawienia aplikacji</h4>
                
                <div class="setting-row">
                    <span>Tryb ciemny</span>
                    <input type="checkbox" id="themeToggle" checked onchange="toggleTheme()">
                </div>
                <div class="setting-row">
                    <span>Powiadomienia PUSH</span>
                    <input type="checkbox" checked>
                </div>
                <div class="setting-row">
                    <span>Powiadomienia SMS</span>
                    <input type="checkbox">
                </div>

                <button class="secondary" onclick="logout()" style="margin-top:20px;">Wyloguj się</button>
            </div>
        </div>

    </div>

</div>

<script>
    // DATA APPS
    let cards = [
        { id: 1, holder: "JAN KOWALSKI", number: "4532 •••• •••• 4821", fullNum: "4532 8912 3456 4821", exp: "08/28", cvv: "739", type: "Debetowa" }
    ];

    const transactions = [
        { name: "Supermarket Biedronka", date: "Dzisiaj", amount: "-45,20 PLN", type: "neg" },
        { name: "Przelew przychodzący", date: "Wczoraj", amount: "+1 200,00 PLN", type: "pos" },
        { name: "Stacja Paliw Orlen", date: "10 Cze", amount: "-210,50 PLN", type: "neg" }
    ];

    // WEBAUTHN / FACE ID LOGOWANIE
    const hasBiometric = localStorage.getItem('biometric_credential_id');
    if (hasBiometric) {
        document.getElementById('pwd-group').style.display = 'none';
        document.getElementById('primary-btn').innerText = "Zaloguj hasłem";
        document.getElementById('biometric-btn').style.display = 'block';
        document.getElementById('login-sub').innerText = "Wykryto skonfigurowane Face ID";
    }

    document.getElementById('primary-btn').addEventListener('click', async () => {
        if (!hasBiometric && document.getElementById('password').value.length < 3) {
            document.getElementById('status-msg').innerText = "Wpisz hasło";
            return;
        }
        if (!hasBiometric && window.PublicKeyCredential) {
            try {
                const credential = await navigator.credentials.create({
                    publicKey: {
                        challenge: new Uint8Array([1, 2, 3, 4]),
                        rp: { name: "Bank App" },
                        user: { id: new Uint8Array([1, 2, 3, 4]), name: "user@bank.pl", displayName: "User" },
                        pubKeyCredParams: [{ alg: -7, type: "public-key" }],
                        authenticatorSelection: { authenticatorAttachment: "platform" },
                        timeout: 60000
                    }
                });
                if (credential) localStorage.setItem('biometric_credential_id', credential.id);
            } catch (e) { console.warn("Pominięto Face ID", e); }
        }
        showApp();
    });

    document.getElementById('biometric-btn').addEventListener('click', async () => {
        const credId = localStorage.getItem('biometric_credential_id');
        if (window.PublicKeyCredential && credId) {
            try {
                const assertion = await navigator.credentials.get({
                    publicKey: { challenge: new Uint8Array([4, 3, 2, 1]), timeout: 60000 }
                });
                if (assertion) showApp();
            } catch (e) { document.getElementById('status-msg').innerText = "Błąd Face ID"; }
        } else { showApp(); }
    });

    function showApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        renderCards();
        renderHistory();
        initGyro();
    }

    function logout() {
        document.getElementById('app-screen').style.display = 'none';
        document.getElementById('login-screen').style.display = 'block';
    }

    // NAWIGACJA ZAKŁADEK
    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        event.target.classList.add('active');
        document.getElementById(`tab-${tabName}`).classList.add('active');
        
        if (tabName === 'blik' && !blikInterval) generateBLIK();
    }

    // RENDERING KART
    function renderCards() {
        const container = document.getElementById('cards-container');
        container.innerHTML = '';
        cards.forEach(card => {
            container.innerHTML += `
                <div class="card-wrapper">
                    <div class="bank-card" onclick="toggleCardDetails(${card.id})">
                        <div class="card-top">
                            <span>VISA</span>
                            <span class="card-type">${card.type}</span>
                        </div>
                        <div class="card-num">${card.number}</div>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span style="font-size:12px;">${card.holder}</span>
                            <button class="danger" onclick="deleteCard(event, ${card.id})">Usuń</button>
                        </div>
                        
                        <!-- SZCZEGÓŁY Z PROSTOKĄTNYM HOLOGRAMEM -->
                        <div class="card-details" id="card-details-${card.id}">
                            <div style="font-size:12px; margin-bottom:4px;">Numer: <strong>${card.fullNum}</strong></div>
                            <div style="font-size:12px; margin-bottom:4px;">Ważność: <strong>${card.exp}</strong> | CVV: <strong>${card.cvv}</strong></div>
                            
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                                <span style="font-size:10px; color:#94a3b8;">HOLOGRAM ZABEZPIECZAJĄCY</span>
                                <div class="holo-rect">
                                    <svg class="holo-symbol" viewBox="0 0 24 24">
                                        <!-- Unikalny znaczek korony -->
                                        <path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/>
                                    </svg>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    function toggleCardDetails(id) {
        const el = document.getElementById(`card-details-${id}`);
        if(el) el.classList.toggle('active');
    }

    function addCard() {
        const holder = document.getElementById('newCardHolder').value || "JAN KOWALSKI";
        const type = document.getElementById('newCardType').value;
        const newId = Date.now();
        const randomNum = Math.floor(1000 + Math.random() * 9000);

        cards.push({
            id: newId,
            holder: holder.toUpperCase(),
            number: `4532 •••• •••• ${randomNum}`,
            fullNum: `4532 8912 3456 ${randomNum}`,
            exp: "12/29",
            cvv: Math.floor(100 + Math.random() * 900).toString(),
            type: type
        });

        renderCards();
        document.getElementById('newCardHolder').value = '';
    }

    function deleteCard(e, id) {
        e.stopPropagation();
        cards = cards.filter(c => c.id !== id);
        renderCards();
    }

    // GENERATOR BLIK
    let blikInterval;
    function generateBLIK() {
        clearInterval(blikInterval);
        const code = Math.floor(100000 + Math.random() * 900000);
        document.getElementById('blikCode').innerText = `${code.toString().substring(0,3)} ${code.toString().substring(3,6)}`;
        
        let timeLeft = 120;
        const progressBar = document.getElementById('timerProgress');
        const timerText = document.getElementById('timerText');

        blikInterval = setInterval(() => {
            timeLeft--;
            timerText.innerText = `Ważny przez: ${timeLeft}s`;
            progressBar.style.width = `${(timeLeft / 120) * 100}%`;

            if (timeLeft <= 0) {
                clearInterval(blikInterval);
                document.getElementById('blikCode').innerText = "EXPIRED";
            }
        }, 1000);
    }

    // HISTORIA TRANSAKCJI
    function renderHistory() {
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        transactions.forEach(t => {
            list.innerHTML += `
                <div class="tx-item">
                    <div>
                        <strong>${t.name}</strong>
                        <div style="font-size:11px; color:var(--text-sub);">${t.date}</div>
                    </div>
                    <span class="tx-amount ${t.type}">${t.amount}</span>
                </div>
            `;
        });
    }

    // USTAWIENIA & MOTYW
    function toggleTheme() {
        document.body.classList.toggle('light-mode', !document.getElementById('themeToggle').checked);
    }

    // ŻYROSKOP DLA HOLOGRAMU
    function initGyro() {
        window.addEventListener('deviceorientation', (e) => {
            if (e.gamma !== null && e.beta !== null) {
                let posX = Math.min(Math.max(((e.gamma + 45) / 90) * 100, 0), 100);
                let posY = Math.min(Math.max(((e.beta - 20) / 60) * 100, 0), 100);
                document.documentElement.style.setProperty('--holo-x', `${posX}%`);
                document.documentElement.style.setProperty('--holo-y', `${posY}%`);
            }
        });

        window.addEventListener('mousemove', (e) => {
            let posX = (e.clientX / window.innerWidth) * 100;
            let posY = (e.clientY / window.innerHeight) * 100;
            document.documentElement.style.setProperty('--holo-x', `${posX}%`);
            document.documentElement.style.setProperty('--holo-y', `${posY}%`);
        });
    }
</script>

</body>
</html>
