<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mBank Quantum</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto; background: #030712; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 400px; height: 100vh; padding: 20px; display: flex; flex-direction: column; justify-content: center; }
        .input-field { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #333; background: #111; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; background: #00f0ff; color: #000; font-weight: bold; cursor: pointer; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; background: #222; margin: 0 auto 20px; background-size: cover; background-position: center; border: 2px solid #00f0ff; }
        .hidden { display: none; }
        #face-id-btn { font-size: 40px; text-align: center; margin: 20px 0; cursor: pointer; display: block; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- EKRAN LOGOWANIA / REJESTRACJI -->
    <div id="login-view">
        <h2 id="login-header">Witaj w mBank Quantum</h2>
        <p id="login-sub">Ustaw swoje hasło, aby rozpocząć.</p>
        <input type="password" id="pass-input" class="input-field" placeholder="Wpisz hasło">
        <button class="btn" onclick="handleAuth()">Zatwierdź</button>
        
        <div id="face-id-container" class="hidden">
            <div id="face-id-btn" onclick="useFaceID()">👁️‍🗨️</div>
            <p style="text-align: center;">Zaloguj przez Face ID</p>
        </div>
    </div>

    <!-- EKRAN GŁÓWNY (APLIKACJA) -->
    <div id="app-view" class="hidden">
        <h2>Edycja Profilu</h2>
        <div id="avatar-display" class="avatar"></div>
        <input type="file" accept="image/*" onchange="uploadPhoto(event)">
        <input type="text" id="name-input" class="input-field" placeholder="Imię i nazwisko">
        <input type="date" id="date-input" class="input-field">
        <button class="btn" onclick="saveProfile()">Zapisz dane</button>
        <button class="btn" style="background: #ff4444; margin-top: 10px;" onclick="logout()">Wyloguj</button>
    </div>
</div>

<script>
    let savedPassword = localStorage.getItem('userPassword');
    
    function handleAuth() {
        const input = document.getElementById('pass-input').value;
        
        if (!savedPassword) {
            // Pierwszy raz: Ustawiamy hasło
            localStorage.setItem('userPassword', input);
            savedPassword = input;
            alert("Hasło ustawione!");
            showApp();
        } else {
            // Kolejny raz: Weryfikacja
            if (input === savedPassword) {
                showApp();
            } else {
                alert("Błędne hasło!");
            }
        }
    }

    function useFaceID() {
        alert("Weryfikacja Face ID...");
        showApp();
    }

    function showApp() {
        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('app-view').classList.remove('hidden');
        // Pokaż przycisk Face ID przy kolejnym powrocie
        document.getElementById('face-id-container').classList.remove('hidden');
    }

    function logout() {
        document.getElementById('app-view').classList.add('hidden');
        document.getElementById('login-view').classList.remove('hidden');
        document.getElementById('pass-input').value = "";
    }

    function uploadPhoto(event) {
        const file = event.target.files[0];
        const reader = new FileReader();
        reader.onload = e => {
            document.getElementById('avatar-display').style.backgroundImage = `url('${e.target.result}')`;
        };
        reader.readAsDataURL(file);
    }

    function saveProfile() {
        const name = document.getElementById('name-input').value;
        alert("Profil zaktualizowany: " + name);
    }
</script>

</body>
</html>
