
<html lang="pl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <!-- Tagi wymuszające tryb pełnoekranowy na iOS (PWA) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Portfel">

  <title>Portfel Mobilny PRO</title>

  <style>
    :root {
      --bg-body: #f4f6f9;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent: #2563eb;
      --accent-blik: #ea580c;
      --nav-bg: rgba(255, 255, 255, 0.88);
      --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
    }

    [data-theme="dark"] {
      --bg-body: #090d16;
      --bg-card: #131a27;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --accent: #3b82f6;
      --accent-blik: #f97316;
      --nav-bg: rgba(19, 26, 39, 0.88);
      --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-body);
      color: var(--text-main);
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .app-viewport {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--bg-card);
      display: flex;
      flex-direction: column;
      position: relative;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(90px, env(safe-area-inset-bottom));
    }

    /* Nagłówek Profilu */
    .header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--border-color);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .avatar-box {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      border: 2px solid var(--border-color);
    }

    .avatar-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-text h2 { font-size: 1.1rem; font-weight: 700; }
    .user-text p { font-size: 0.75rem; color: var(--text-muted); }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--bg-body);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
    }

    /* Sekcja BLIK */
    .quick-blik-section {
      padding: 16px 20px;
      background: var(--bg-body);
      border-bottom: 1px solid var(--border-color);
    }

    .blik-banner {
      background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
      color: white;
      border-radius: 20px;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    .blik-logo {
      font-weight: 900;
      font-size: 1.4rem;
      color: #ffffff;
    }

    .blik-btn {
      background: var(--accent-blik);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.4);
    }

    /* Zawartość przewijana */
    .scroll-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .add-link { color: var(--accent); cursor: pointer; }

    /* Karty */
    .card-list { display: flex; flex-direction: column; gap: 14px; }

    .card-item {
      padding: 20px;
      border-radius: 20px;
      color: white;
      position: relative;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      cursor: pointer;
    }

    .card-blue { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
    .card-green { background: linear-gradient(135deg, #059669, #047857); }
    .card-purple { background: linear-gradient(135deg, #7c3aed, #6d28d9); }

    .card-type { font-size: 0.75rem; opacity: 0.8; text-transform: uppercase; }
    .card-name { font-size: 1.2rem; font-weight: 700; margin: 4px 0 16px 0; }
    .card-number { font-family: monospace; font-size: 0.95rem; opacity: 0.9; }

    /* Historia */
    .history-list { display: flex; flex-direction: column; gap: 10px; }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background: var(--bg-body);
      border: 1px solid var(--border-color);
      border-radius: 16px;
    }

    .history-info h4 { font-size: 0.9rem; font-weight: 600; }
    .history-info p { font-size: 0.75rem; color: var(--text-muted); }
    .history-amount { font-weight: 700; font-size: 0.95rem; }

      bottom: 0;
